openapi: 3.1.0
info:
  title: OneOf Discriminator Fixture
  version: 1.0.0
paths:
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: petType
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
    Cat:
      type: object
      required:
        - petType
        - meowVolume
      properties:
        petType:
          type: string
          enum:
            - cat
        meowVolume:
          type: integer
    Dog:
      type: object
      required:
        - petType
        - barkVolume
      properties:
        petType:
          type: string
          enum:
            - dog
        barkVolume:
          type: integer
