openapi: 3.1.0
info:
  title: External Ref Fixture
  version: 1.0.0
paths:
  /things/{id}:
    get:
      operationId: getThing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A thing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/thing.schema'
        '404':
          description: Not found
components:
  schemas:
    ThingKind:
      type: string
      enum:
        - widget
        - gadget
    thing.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://example.com/schemas/thing.schema.json
      title: Thing
      type: object
      $defs:
        ThingKind:
          type: string
          enum:
            - widget
            - gadget
      required:
        - id
        - kind
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ThingKind'
        label:
          type:
            - string
            - 'null'
      additionalProperties: false
