openapi: 3.1.0
info:
  title: Const Fixture
  version: 1.0.0
paths:
  /version:
    get:
      operationId: getVersion
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
components:
  schemas:
    VersionInfo:
      type: object
      required:
        - schemaVersion
        - apiName
      properties:
        schemaVersion:
          const: 1
        apiName:
          const: speckify
