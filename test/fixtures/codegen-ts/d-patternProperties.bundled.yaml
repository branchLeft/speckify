openapi: 3.1.0
info:
  title: PatternProperties Fixture
  version: 1.0.0
paths:
  /configs/{id}:
    get:
      operationId: getConfig
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
components:
  schemas:
    Config:
      type: object
      required:
        - id
      properties:
        id:
          type: string
      patternProperties:
        ^x-[a-z]+$:
          type: string
      additionalProperties: false
