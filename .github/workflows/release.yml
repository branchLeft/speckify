name: release

# Fires on a signed `vX.Y.Z` tag. Stages and publishes Speckify itself, not a generated
# contract package: `speckify` to npm with provenance, and the `speckify`
# PyPI launcher, both via OIDC trusted publishing — no stored token either
# side.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  assert-tag-matches-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the tag matches package.json's version
        id: version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  npm:
    needs: assert-tag-matches-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Staged, not published: the version waits on npm until a maintainer
      # approves it with 2FA (`npm stage approve`), so CI alone never ships.
      - name: Stage the npm release with provenance
        run: npm stage publish --provenance --access public

  pypi:
    needs: assert-tag-matches-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0

      - name: Build the launcher package
        run: uv build

      - name: Publish to PyPI via trusted publishing
        run: uv publish --trusted-publishing always
