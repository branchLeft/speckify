openapi: 3.1.0
info:
  title: Dogfood Notes
  version: 0.0.0
  description: >
    A tiny notes API, used by Speckify's own dogfood exercise
    (examples/dogfood) to prove the generated client/server packages work in
    a real TypeScript and Python app across a first publish and three
    upgrade rounds. R1: this sentence was added as a description-only edit.
    R2: added an optional `tags` field to Note and a delete-note endpoint.
    R3: removed `body` from Note's response representation -- a note's body
    is still required to create one (see NoteCreate), it just isn't echoed
    back.
paths:
  /notes:
    get:
      operationId: listNotes
      summary: List all notes.
      responses:
        '200':
          description: Every note, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
    post:
      operationId: createNote
      summary: Create a note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: The created note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
  /notes/{noteId}:
    get:
      operationId: getNote
      summary: Get one note by id.
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404':
          description: No note with that id.
    delete:
      operationId: deleteNote
      summary: Delete a note by id.
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The note was deleted.
components:
  schemas:
    Note:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            type: string
    NoteCreate:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
