# Shared branchLeft Python type-checking policy (SYNC-1). Add `python_version`
# as a plain line in THIS SAME [mypy] section (matching requires-python) —
# NEVER open a second `[mypy]` header: mypy silently drops every setting in
# the file when one exists. See docs/shell-and-python.md.

[mypy]
strict = True
disallow_any_explicit = True
python_version = 3.13
