name: Speckify
description: >
  Bundle an OpenAPI contract, compute its next version against the registry,
  and either report that plan on a pull request or publish it on merge.
author: Speckify
inputs:
  command:
    description: >
      Which Speckify command to run: "check" (pull request mode, comments the
      plan), "plan" (prints the plan as JSON), "build" (generates the packages
      into .speckify/out, for a drift check against committed generated code)
      or "publish" (main mode). Anything else is refused.
    required: true
  config:
    description: 'Path to speckify.yaml, relative to the repository root.'
    required: false
    default: speckify.yaml
  attest:
    description: >
      With command "publish": pack each npm package, attest the tarballs with
      actions/attest-build-provenance, then publish those same tarballs after
      checking each one's sha-256 digest is one of the attestation's subjects.
      "true" (the default) or "false". On, the calling job needs
      `id-token: write` and `attestations: write` as well as `packages: write`.
      Off, the packages are published as before, with no attestation.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # First, so a typo fails in a second rather than after an install and a
    # build. Both values arrive through the environment, never interpolated
    # into the script.
    - name: Check the inputs
      id: inputs
      shell: bash
      env:
        SPECKIFY_COMMAND: ${{ inputs.command }}
        SPECKIFY_ATTEST: ${{ inputs.attest }}
      run: |
        set -eu
        case "$SPECKIFY_COMMAND" in
          check|plan|build|publish) ;;
          *) echo "::error::command must be one of check, plan, build, publish: '$SPECKIFY_COMMAND'" >&2; exit 1 ;;
        esac
        case "$SPECKIFY_ATTEST" in
          true|false) ;;
          *) echo "::error::attest must be true or false: '$SPECKIFY_ATTEST'" >&2; exit 1 ;;
        esac

    # Bare, no registry-url/scope: only used to build Speckify itself below,
    # resolving its own public dependencies (zod, commander, ...) from the
    # default registry. The caller's npm scope (read after the build, once
    # Speckify's own CLI can read it) gets its own setup-node step further
    # down, which only adds a *second* registry mapping to .npmrc -- it does
    # not need to replace this one.
    #
    # The version is written out, not read from .nvmrc: a node-version-file
    # under ${{ github.action_path }} is an absolute path, which setup-node
    # joins onto the caller's workspace, so the file is never found outside
    # this repository. scripts/action-node-setup.test.ts keeps this value
    # equal to .nvmrc.
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '26.5.0'

    - name: Set up uv
      uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0

    - name: Enable corepack
      shell: bash
      run: corepack enable

    # Runs from ${{ github.action_path }} — wherever this action's own repo
    # was checked out at the pinned SHA/tag a caller resolved — so a SHA pin
    # on this action runs exactly that commit's code, with no npm fetch of
    # Speckify itself at run time.
    - name: Install Speckify's own dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile

    - name: Build Speckify
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm run build

    # Read through Speckify's own parsed, validated config -- never a
    # grep/sed over the YAML text, which reads an inline comment
    # ("owner: acme  # note") straight into the value, since grep/sed know
    # nothing about YAML comment syntax. `|| true` degrades to an empty
    # scope (rather than failing the job) for a config `config get` cannot
    # resolve; the `Run Speckify` step below still surfaces that as a real
    # error once it loads the same config itself.
    - name: Read the npm owner from the caller's config
      id: npm-owner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SPECKIFY_ACTION_PATH: ${{ github.action_path }}
        SPECKIFY_CONFIG: ${{ inputs.config }}
      run: |
        owner=$(node "$SPECKIFY_ACTION_PATH/dist/cli.js" config get publish.githubPackages.owner \
          --config "$SPECKIFY_CONFIG" 2>/dev/null) || owner=""
        echo "scope=${owner:+@$owner}" >> "$GITHUB_OUTPUT"

    # `NODE_AUTH_TOKEN` being set on a later step's environment does nothing
    # by itself: npm only uses it where an .npmrc line interpolates it for a
    # specific registry host, which is what setup-node's `registry-url`
    # writes here, scoped to `@<owner>:registry=...` so it does not touch
    # the default registry the bare setup-node step above already pointed
    # at the public registry for Speckify's own dependencies. Skipped
    # entirely (not a second always-run variant) when the config has no npm
    # scope to speak of: setup-node treats an empty `scope` as "none given"
    # and would instead repoint the job's *default* registry at
    # `registry-url`.
    - name: Set up GitHub Packages auth, scoped to the caller's owner
      if: steps.npm-owner.outputs.scope != ''
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '26.5.0'
        registry-url: https://npm.pkg.github.com
        scope: ${{ steps.npm-owner.outputs.scope }}

    # Every command except a publish that attests. `plan` prints JSON, the one
    # format it has, so the flag is added here rather than asked of the caller.
    - name: Run Speckify
      id: run
      if: inputs.command != 'publish' || inputs.attest != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SPECKIFY_ACTION_PATH: ${{ github.action_path }}
        SPECKIFY_COMMAND: ${{ inputs.command }}
        SPECKIFY_CONFIG: ${{ inputs.config }}
      run: |
        set -eu
        args=("$SPECKIFY_COMMAND" --config "$SPECKIFY_CONFIG")
        if [ "$SPECKIFY_COMMAND" = plan ]; then
          args+=(--json)
        fi
        node "$SPECKIFY_ACTION_PATH/dist/cli.js" "${args[@]}"

    # A publish that attests runs in three steps so the bytes signed are the
    # bytes published: pack the npm packages into tarballs, attest those
    # files, then publish those files after re-checking each one's sha-256
    # digest against the attestation. The pack step also records which
    # tarballs exist, because attesting an empty set is an error: when every
    # version is already on the registry there is nothing to attest.
    - name: Pack the npm packages
      id: pack
      if: inputs.command == 'publish' && inputs.attest == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SPECKIFY_ACTION_PATH: ${{ github.action_path }}
        SPECKIFY_CONFIG: ${{ inputs.config }}
      run: |
        set -eu
        pack_dir="$RUNNER_TEMP/speckify-pack"
        rm -rf "$pack_dir"
        node "$SPECKIFY_ACTION_PATH/dist/cli.js" publish --config "$SPECKIFY_CONFIG" --pack-only --pack-dir "$pack_dir"
        {
          echo "pack-dir=$pack_dir"
          if compgen -G "$pack_dir/*.tgz" > /dev/null; then
            echo "has-tarballs=true"
          else
            echo "has-tarballs=false"
          fi
        } >> "$GITHUB_OUTPUT"

    # Needs `id-token: write` and `attestations: write` on the calling job.
    # `create-storage-record` stays off: storage records need
    # `artifact-metadata: write`, which nothing here uses.
    - name: Attest the packed tarballs
      id: attest
      if: steps.pack.outputs.has-tarballs == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.pack.outputs.pack-dir }}/*.tgz
        create-storage-record: false

    # `--attestation` makes the publish refuse unless every tarball's digest
    # is a subject of the attestation just made, and the publish itself
    # re-hashes each tarball against the digest recorded when it was packed;
    # a mismatch publishes nothing. Tarballs with no attestation are refused
    # here, before the CLI runs, rather than published unsigned.
    - name: Publish the packed packages
      id: publish-packed
      if: inputs.command == 'publish' && inputs.attest == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SPECKIFY_ACTION_PATH: ${{ github.action_path }}
        SPECKIFY_CONFIG: ${{ inputs.config }}
        SPECKIFY_PACK_DIR: ${{ steps.pack.outputs.pack-dir }}
        SPECKIFY_HAS_TARBALLS: ${{ steps.pack.outputs.has-tarballs }}
        SPECKIFY_ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
      run: |
        set -eu
        if [ "$SPECKIFY_HAS_TARBALLS" = true ] && [ -z "$SPECKIFY_ATTESTATION" ]; then
          echo "::error::the tarballs were packed but the attest step left no attestation; nothing was published" >&2
          exit 1
        fi
        args=(publish --config "$SPECKIFY_CONFIG" --from-pack --pack-dir "$SPECKIFY_PACK_DIR")
        if [ -n "$SPECKIFY_ATTESTATION" ]; then
          args+=(--attestation "$SPECKIFY_ATTESTATION")
        fi
        node "$SPECKIFY_ACTION_PATH/dist/cli.js" "${args[@]}"
